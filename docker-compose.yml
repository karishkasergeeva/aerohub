# Локальне розгортання прототипу ІС «AeroHub»:
#   docker compose up --build    →  веб-клієнт http://localhost:8080, табло http://localhost:8080/board.html
name: aerohub

x-service: &service
  build: { context: ., dockerfile: services/Dockerfile }
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }

x-env: &env
  EVENT_BUS: kafka
  KAFKA_BOOTSTRAP: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
  HOME_AIRPORT: ${HOME_AIRPORT:-KBP}

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: aerohub, POSTGRES_PASSWORD: aerohub, POSTGRES_DB: aerohub }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aerohub"], interval: 5s, retries: 20 }

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  flight-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: flight_service } }
    environment: { <<: *env, SERVICE_NAME: flight-service, DATABASE_URL: "postgresql+psycopg://aerohub:aerohub@postgres:5432/flight_db" }
    ports: ["8001:8000"]

  resource-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: resource_service } }
    environment: { <<: *env, SERVICE_NAME: resource-service, DATABASE_URL: "postgresql+psycopg://aerohub:aerohub@postgres:5432/resource_db" }
    ports: ["8002:8000"]

  fids-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: fids_service } }
    environment: { <<: *env, SERVICE_NAME: fids-service, DATABASE_URL: "postgresql+psycopg://aerohub:aerohub@postgres:5432/fids_db" }
    ports: ["8003:8000"]

  acdm-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: acdm_service } }
    environment: { <<: *env, SERVICE_NAME: acdm-service, DATABASE_URL: "postgresql+psycopg://aerohub:aerohub@postgres:5432/acdm_db" }
    ports: ["8004:8000"]

  task-service:
    <<: *service
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: task_service } }
    environment: { <<: *env, SERVICE_NAME: task-service, DATABASE_URL: "postgresql+psycopg://aerohub:aerohub@postgres:5432/task_db" }
    ports: ["8005:8000"]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports: ["8080:80"]
    depends_on: [flight-service, resource-service, fids-service, acdm-service, task-service]

volumes:
  pgdata:
