# API Gateway прототипу: маршрутизація запитів до мікросервісів і роздача веб-клієнта
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Адреси сервісів визначаються через DNS Docker під час кожного запиту (resolver + змінні),
# тому після перестворення контейнера шлюз не надсилає запити на стару IP-адресу (дефект D-09).

# Обмеження частоти запитів на IP-адресу. Робочі місця терміналу виходять у мережу через NAT
# з однієї адреси, тому ліміти розраховано на зміну до 50 операторів (дефект D-10).
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;

server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $flight   flight-service:8000;
  set $resource resource-service:8000;
  set $fids     fids-service:8000;
  set $acdm     acdm-service:8000;
  set $tasks    task-service:8000;
  client_max_body_size 10m;
  root /usr/share/nginx/html;
  index index.html;

  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Заголовки безпеки
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
  server_tokens off;
  limit_req_status 429;

  location = /api/v1/auth/token { limit_req zone=login burst=50 nodelay; proxy_pass http://$flight; }

  # Відповідь 429 у форматі JSON, як і решта помилок API
  error_page 429 = @too_many;
  location @too_many { default_type application/json; return 429 '{"detail":"Забагато запитів, повторіть пізніше"}'; }

  location ^~ /api/v1/acdm/                       { limit_req zone=api burst=400 nodelay; proxy_pass http://$acdm; }
  location ^~ /api/v1/tasks                       { limit_req zone=api burst=400 nodelay; proxy_pass http://$tasks; }
  location ~ ^/api/v1/(flights|schedules|auth)    { limit_req zone=api burst=400 nodelay; proxy_pass http://$flight; }
  location ~ ^/api/v1/(resources|allocations|resource-types) { limit_req zone=api burst=400 nodelay; proxy_pass http://$resource; }
  location ^~ /api/v1/public/                     { limit_req zone=api burst=400 nodelay; proxy_pass http://$fids; }
  location /ws/ {
    proxy_pass http://$fids;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
  location / { try_files $uri $uri/ /index.html; }
}
